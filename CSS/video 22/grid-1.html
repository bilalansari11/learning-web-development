<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container {
            width: 80vw;
            height: 50vh;
            border: 2px solid yellow;
            display: grid;
            justify-items: center;
            align-items: center;
            /* grid-template-columns: [pehla] 120px [dosra]100px [teesra]; */
            /* grid-template-rows: 100px 100px 100px; */
            /* grid-template-columns: 1fr 2fr 1fr; */
            /* grid-template-columns: repeat(4, 1fr); */ /* make 4 equally columns of 1/4 bc repeat 4 */
            /* grid-template-columns: repeat(4, minmax(100px, 1fr)); */
            grid-template-columns: repeat(4, 60px);
            grid-template-rows: repeat(2, 60px);
            /* justify-content: center; */ /* center content/grid in row */
            /* align-content: center; */ /* center content/grid in column */
            place-content: center; /* center content/grid in both directions */
            /* gap: 20px; */
            row-gap: 10px;
            column-gap: 30px;
        }
        .item {
            border: 2px solid red;
            width: 45px;
            height: 45px;
        }
        /* .item-4 {
            grid-column: pehla/teesra;
            grid-row: 1/2;
        } */
        .item-1 {
            /* border: 2px solid green; */
            /* grid-column: 1/2; */
            /* grid-column-start: 1; */
            /* grid-column-end: 2; */
            /* grid-row: 1/2; */
            /* OR write separately */
            /* grid-row-start: 1; */
            /* grid-row-end: 2; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
