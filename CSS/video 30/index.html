<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        img {
            width: 400px;
        }
        .img-1 {
            filter: brightness(122%);
        }
        .img-2 {
            filter: grayscale(60%);
        }
        .img-3 {
            filter: sepia(10);
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img-1" src="assets/image-1.jpg" alt="">
        <img class="img-2" src="assets/FM.jpg" alt="">
        <img class="img-3" src="assets/TH.webp" alt="">
    </div>
</body>
</html>
