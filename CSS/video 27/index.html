<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container {
            background-color: rgb(72, 151, 151);
            height: 80vh;
            width: 30vw;
        }

        .box {
            width: 34px;
            height: 45px;
            /* background-color: aqua; */
            /* animation-name: meraAnimation;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0, 0, 0, 0.96);
            animation-delay: 1s;
            animation-direction: reverse;
            animation-play-state: paused; */

            /* Short-hand property property */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: meraAnimation 3s ease-in-out 3s 1, 
                        meraAnimation2 3s ease-in 3s 1;
        }

        @keyframes meraAnimation {
            from {
                background-color: blue;
            }

            to {
                background-color: yellow;
                /* transform: translateX(200px); */
            }
        }

        @keyframes meraAnimation2 {
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(300deg);
            }
            80%{
                transform: rotate(320deg);
            }
            100%{
                transform: rotate(330deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
</body>

</html>
