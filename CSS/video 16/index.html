<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>
</head>
<style>
    body {
        background-color: red;
    }

    @media screen and (orientation: landscape) { /* landscape = width > height, portrait = width < height */
        body {
            border: 2px solid purple;
        }
    }

    @media only screen and (max-width: 500px) {
        body {
            background-color: blue;
        }

        .boxes {
            flex-direction: column;
        }
    }

    .boxes {
        display: flex;
    }

    .box {
        /* border: 1px solid black; */
        width: 200px;
        height: 200px;
        background-color: blueviolet;
        padding: 3px;
        margin: 3px;
    }
</style>

<body>
    <div>
        Hey I am a red body guy!
    </div>

    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
